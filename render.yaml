services:
  - name: portfolio-web
    type: web
    runtime: docker
    repo: https://github.com/Nyl-Sauval/portfolio
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan key:generate
      npm install && npm run build
      php artisan migrate --force
    startCommand: |
      php artisan serve --host=0.0.0.0 --port=10000
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
